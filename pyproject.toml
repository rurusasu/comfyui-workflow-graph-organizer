[project]
name = "workflow-graph-organizer"
description = "ComfyUI Workflow Graph Organizer"
version = "1.0.1"
requires-python = ">=3.13"
readme = "README.md"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
  "bump-my-version>=1.2.2",
]

[project.urls]
Repository = "https://github.com/rurusasu/comfyui-workflow-graph-organizer"

[tool.comfy]
PublisherId = "rurusasu"
DisplayName = "ComfyUI Workflow Graph Organizer"
Icon = "https://raw.githubusercontent.com/rurusasu/comfyui-workflow-graph-organizer/main/assets/icon.svg"
requires-comfyui = ">=0.3.0"
includes = ['dist/']

[tool.bumpversion]
current_version = "1.0.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = true
tag_name = "workflow-graph-organizer-v{new_version}"
tag_message = "Release version {new_version}"
message = "chore: bump version to {new_version} [skip ci]"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/settings.ts"
search = 'export const CURRENT_VERSION = "{current_version}";'
replace = 'export const CURRENT_VERSION = "{new_version}";'
