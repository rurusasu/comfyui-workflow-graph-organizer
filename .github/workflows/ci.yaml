name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality, unit tests, and library smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: git diff --check HEAD^ HEAD
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:lib

  e2e:
    name: Full browser E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium --with-deps
      - uses: actions/cache@v6.1.0
        with:
          path: .test-comfy
          key: ${{ runner.os }}-test-comfy-${{ hashFiles('.python-version', 'e2e.config.ts', 'scripts/setup-test-comfy.ts', 'scripts/setup-test-comfy-helpers.ts') }}
      - run: pnpm setup:e2e
        timeout-minutes: 15
      - run: pnpm test:e2e
        timeout-minutes: 30
      - name: Upload browser-test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-test-results
          path: |
            tests/screenshots/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
