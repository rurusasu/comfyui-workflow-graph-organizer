name: Publish reviewed release candidate to Comfy Registry

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify reviewed main at 1.0.0
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    outputs:
      release-sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --group dev
      - name: Verify product identity and existing release version
        id: identity
        shell: bash
        run: |
          test "$(node -p "require('./package.json').name")" = "@rurusasu/workflow-graph-organizer"
          test "$(node -p "require('./package.json').version")" = "1.0.0"
          grep -Fx 'name = "workflow-graph-organizer"' pyproject.toml
          grep -Fx 'version = "1.0.0"' pyproject.toml
          grep -Fx 'export const CURRENT_VERSION = "1.0.0";' src/settings.ts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! git rev-parse --verify --quiet "refs/tags/workflow-graph-organizer-v1.0.0"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: git diff --check HEAD^ HEAD
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:lib
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium --with-deps
      - uses: actions/cache@v6.1.0
        with:
          path: .test-comfy
          key: ${{ runner.os }}-test-comfy-${{ hashFiles('.python-version', 'e2e.config.ts', 'scripts/setup-test-comfy.ts', 'scripts/setup-test-comfy-helpers.ts') }}
      - run: pnpm setup:e2e
        timeout-minutes: 15
      - run: pnpm test:e2e
        timeout-minutes: 30
      - name: Upload browser-test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-e2e-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Create workflow-graph-organizer-v1.0.0 release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release-sha }}
          fetch-depth: 0
      - name: Create prefixed tag and matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.release-sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git tag -a workflow-graph-organizer-v1.0.0 -m "Release workflow-graph-organizer-v1.0.0" "$RELEASE_SHA"
          git push origin workflow-graph-organizer-v1.0.0
          gh release create workflow-graph-organizer-v1.0.0 --target "$RELEASE_SHA" --title "workflow-graph-organizer-v1.0.0" --generate-notes

  registry:
    name: Publish exact reviewed checkout to Comfy Registry
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: Comfy-Org/publish-node-action@1.0.1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
